<style>
/* Layout: brand line + live hint on top, four chat phones side by side (tabs on a phone), owner's evening report below. */
/* Layout: site header, live hint, four chat phones side by side (tabs on a phone), owner's report, call to action. Colors and fonts follow Abdullab. */
:root {
  --bg: #f6f4ef;
  --ink: #16181d;
  --muted: #5d6370;
  --line: #e4e0d6;
  --accent: #2a6df4;
  --accent-ink: #ffffff;
  --spark: #ff7a45;
  --spark-ink: #2a1205;
  --spark-soft: #fff1e8;
  --spark-text: #b4541f;
  --phone: #ffffff;
  --chat: #eef1f6;
  --bub-in: #ffffff;
  --bub-out: #dbe7ff;
  --key: #f1f3f8;
  --key-ink: #2a4fb0;
  --tag: #eef3ff;
  --shadow: 0 20px 50px -25px rgba(0, 0, 0, .25);
  --font-display: Oswald, "Noto Sans Georgian", Rubik, system-ui, sans-serif;
  --font-body: Rubik, "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --ink: #f1f2f4; --muted: #a2a8b4; --line: #2b2f37;
    --accent: #5b8cff; --accent-ink: #0b0d12; --spark: #ff8b5c; --spark-ink: #2a1205; --spark-soft: #3a2418; --spark-text: #ffb48c;
    --phone: #1a1d23; --chat: #14171c; --bub-in: #222631; --bub-out: #24375f;
    --key: #232833; --key-ink: #a9c0ff; --tag: #1f2a44; --shadow: 0 20px 50px -25px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --ink: #f1f2f4; --muted: #a2a8b4; --line: #2b2f37;
  --accent: #5b8cff; --accent-ink: #0b0d12; --spark: #ff8b5c; --spark-ink: #2a1205; --spark-soft: #3a2418; --spark-text: #ffb48c;
  --phone: #1a1d23; --chat: #14171c; --bub-in: #222631; --bub-out: #24375f;
  --key: #232833; --key-ink: #a9c0ff; --tag: #1f2a44; --shadow: 0 20px 50px -25px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top ---------- */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.site { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.logo{display:inline-flex;align-items:center;font-family:Lexend,sans-serif;font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;color:var(--ink)}
.logo img{width:30px;height:30px;display:block;margin-right:10px}
.logo span { color: var(--accent); }
.site nav { display: flex; gap: 18px; align-items: center; }
.site nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
.site nav a.cta-link { color: var(--accent); }
.eyebrow { display: inline-block; background: var(--tag); color: var(--key-ink); padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; margin-bottom: 12px; }
.final { background: var(--ink); color: var(--bg); border-radius: 28px; padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.final h2 { font: 600 clamp(28px, 4.4vw, 44px)/1.1 var(--font-display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.final p { margin: 0; opacity: .75; max-width: 52ch; }
.btn-main { display: inline-flex; padding: 14px 22px; border-radius: 999px; font-weight: 700; text-decoration: none; background: var(--accent); color: var(--accent-ink); }
.brand h1 { font: 600 clamp(32px, 5vw, 52px)/1.05 var(--font-display); margin: 0; text-transform: uppercase; text-wrap: balance; }
.brand { min-width: 0; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.controls { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--phone); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ghost { border: 1px solid var(--line); background: var(--phone); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; }

/* ---------- hint ---------- */
.hint {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  background: var(--spark-soft); border-radius: 14px; padding: 12px 16px;
}
.hint .step { font: 600 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--spark-text); white-space: nowrap; }
.hint .text { flex: 1 1 280px; min-width: 0; font-weight: 500; }
.hint button { border: 0; background: var(--spark); color: var(--spark-ink); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; }

/* ---------- phones ---------- */
.tabs { display: none; gap: 6px; flex-wrap: wrap; }
.tabs button { position: relative; border: 1px solid var(--line); background: var(--phone); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--spark); color: var(--spark-ink); font-size: 11px; line-height: 18px; text-align: center; }
.stage { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.phone {
  background: var(--phone); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto; height: 600px; min-width: 0;
  outline: 2px solid transparent; transition: outline-color .2s;
}
.phone.is-target { outline-color: var(--spark); }
.phone header { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--tag); color: var(--accent); flex: none; }
.ava svg { width: 19px; height: 19px; }
.tabs svg { width: 15px; height: 15px; vertical-align: -2px; }
.phone header b { display: block; font-size: 14px; }
.phone header small { color: var(--muted); font-size: 12px; }
.chat { background: var(--chat); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.msg { max-width: 92%; display: grid; gap: 4px; }
.msg.me { align-self: flex-end; }
.bubble { background: var(--bub-in); border-radius: 14px 14px 14px 4px; padding: 7px 10px 6px; white-space: pre-line; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
.me .bubble { background: var(--bub-out); border-radius: 14px 14px 4px 14px; }
.bubble time { float: right; margin: 6px 0 -2px 10px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bubble b { font-weight: 600; }
.keys { display: grid; gap: 4px; }
.keys .row { display: flex; gap: 4px; }
.keys button {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-weight: 500;
  background: color-mix(in srgb, var(--bub-in) 70%, transparent); color: var(--key-ink);
  line-height: 1.25; overflow-wrap: anywhere;
}
.keys button:hover { background: var(--bub-in); }
.keys button.pick { animation: pulse 1.6s ease-in-out infinite; box-shadow: inset 0 0 0 2px var(--spark); }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px transparent; } }
.dock { border-top: 1px solid var(--line); padding: 8px; display: grid; gap: 6px; }
.dock-keys { display: grid; gap: 6px; }
.dock .row { display: flex; gap: 6px; }
.dock button { flex: 1 1 0; min-width: 0; border: 0; background: var(--key); border-radius: 10px; padding: 9px 6px; font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.dock button.pick { box-shadow: inset 0 0 0 2px var(--spark); animation: pulse 1.6s ease-in-out infinite; }
.dock .group-note { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 4px; }
.sys { align-self: center; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--bub-in) 60%, transparent); padding: 3px 10px; border-radius: 999px; }

/* ---------- owner report ---------- */
.owner { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
.owner .phone { height: auto; }
.owner .chat { min-height: 150px; }
.sheet { background: var(--phone); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; min-width: 0; display: grid; gap: 10px; }
.sheet h3, .owner-title { font: 600 13px/1.2 var(--font-display); margin: 0; letter-spacing: .02em; }
.tabs-sheet { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; }
.tabs-sheet span { padding: 4px 9px; border-radius: 6px 6px 0 0; background: var(--chat); color: var(--muted); }
.tabs-sheet span.on { background: var(--accent); color: var(--accent-ink); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 640px; }
th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
th { background: var(--chat); font-weight: 600; }
td.new { background: var(--spark-soft); }
.example { color: var(--muted); font-size: 12px; }

/* ---------- features ---------- */
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 28px; padding-top: 4px; }
.features div { display: grid; gap: 2px; align-content: start; }
.features b { font-weight: 600; }
.features span { color: var(--muted); font-size: 14px; }

@media (max-width: 1100px) { .stage, .features { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .tabs { display: flex; }
  .stage, .features { grid-template-columns: minmax(0, 1fr); }
  .stage .phone:not(.active) { display: none; }
  .phone { height: 560px; }
  .owner { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .keys button.pick, .dock button.pick { animation: none; }
  .chat { scroll-behavior: auto; }
}
</style>
</head>

  // ---------- состояние ----------
  let lang = pickLang();
  let S, chats, seq, tab, unread;

  function fresh() {
    S = {
      clock: 12 * 60 + 40, number: 14, table: null, cart: {}, cat: null, wview: null, sent: false, cancelled: false,
      tickets: {}, billReq: false, paid: false, method: null, kview: null, report: false,
      sentAt: null, paidAt: null,
    };
    chats = { waiter: [], kitchen: [], bar: [], cashier: [], owner: [] };
    seq = 0; tab = "waiter"; unread = { waiter: 0, kitchen: 0, bar: 0, cashier: 0 };
  }

  function pickLang() {
    const h = (location.hash || "").slice(1);
    if (T[h]) return h;
    const nav = (navigator.language || "ru").slice(0, 2);
    return nav === "ka" || nav === "ru" ? nav : "en";
  }

  // ---------- помощники ----------
  const t = (key, args = {}) => {
    let s = T[lang][key] ?? T.ru[key] ?? key;
    if (typeof s !== "string") return s;
    return s.replace(/\{(\w+)\}/g, (_, k) => (k in args ? args[k] : `{${k}}`));
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => `${n} ₾`;
  const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const item = (id) => MENU.find((m) => m.id === id);
  const name = (m) => m[lang];
  const place = () => (S.table === "x" ? t("takeaway") : t("table", { n: S.table }));
  const stationName = (st) => t(st);
  const lines = () => Object.entries(S.cart).filter(([, q]) => q > 0).map(([id, q]) => ({ m: item(id), q }));
  const total = () => lines().reduce((s, l) => s + l.m.price * l.q, 0);
  const short = (st) => lines().filter((l) => l.m.st === st).map((l) => `${l.q}× ${name(l.m)}`).join(", ");
  const tick = (min = 1) => { S.clock += min; return S.clock; };

  function push(chat, msg) {
    msg.id = ++seq;
    msg.time = msg.time ?? S.clock;
    chats[chat].push(msg);
    if (chat in unread && chat !== tab && narrow()) unread[chat]++;
    return msg;
  }
  const narrow = () => matchMedia("(max-width: 720px)").matches;

  // ---------- что показывает каждое сообщение ----------
  function view(msg) {
    switch (msg.kind) {
      case "me": return { text: t(msg.key), me: true };
      case "text": return { text: t(msg.key, msg.args?.()) };
      case "wscreen": return waiterScreen(msg);
      case "ticket": return ticket(msg.st);
      case "mytables": return myTables(msg.snap);
      case "kscreen": return kassaScreen();
      case "report": return { text: reportText() };
      default: return { text: "" };
    }
  }

  function waiterScreen(msg) {
    if (msg.frozen === "sent") {
      const out = [t("order.sent", { place: place(), number: S.number })];
      for (const st of ["kitchen", "bar"]) if (short(st)) out.push(`${ICON[st]} <b>${esc(stationName(st))}</b>: ${esc(short(st))}`);
      return { text: out.join("\n"), html: true };
    }
    if (msg.frozen === "cancelled") return { text: t("cart.cancelled") };
    if (S.wview === "tables") {
      const keys = [];
      const nums = Array.from({ length: TABLES }, (_, i) => i + 1);
      for (let i = 0; i < nums.length; i += 4) keys.push(nums.slice(i, i + 4).map((n) => ({
        label: BUSY.includes(n) ? `•${n}` : String(n), act: BUSY.includes(n) ? "busy" : "w_table", arg: n, pick: n === 4,
      })));
      keys.push([{ label: t("btn.takeaway"), act: "w_table", arg: "x" }, { label: t("btn.cancel"), act: "w_cancel" }]);
      return { text: t("choose_table"), keys };
    }
    // корзина
    const ls = lines();
    const text = [t("cart.title", { place: place() })];
    if (!ls.length) text.push("  " + t("cart.empty"));
    for (const l of ls) text.push(`  ${l.q}× ${name(l.m)} — ${money(l.m.price * l.q)}`);
    if (S.cat === null) text.push("", t("cart.choose_category"));
    const keys = [Object.keys(CATS).map((c) => ({ label: (S.cat === c ? "• " : "") + CATS[c][lang], act: "w_cat", arg: c, pick: S.cat === null && !ls.length }))];
    if (S.cat) {
      const items = MENU.filter((m) => m.cat === S.cat).map((m) => ({ label: `${name(m)} ${money(m.price)}`, act: "w_add", arg: m.id }));
      for (let i = 0; i < items.length; i += 2) keys.push(items.slice(i, i + 2));
    }
    if (ls.length) keys.push([{ label: t("btn.send"), act: "w_send", pick: ls.some((l) => l.m.st === "kitchen") && ls.some((l) => l.m.st === "bar") }, { label: t("btn.cancel"), act: "w_cancel" }]);
    return { text: text.join("\n"), keys };
  }

  function ticket(st) {
    const k = S.tickets[st];
    const head = `${ICON[st]} ${place()} · #${S.number} · ${hhmm(k.created)}`;
    const items = lines().filter((l) => l.m.st === st).map((l) => `${l.q}× ${name(l.m)}`);
    if (k.status === "ready") {
      return { text: `✔ ${place()} · #${S.number} · ${hhmm(k.created)} · ` + t("ticket.ready", { time: hhmm(k.ready), min: k.ready - k.created }) };
    }
    const text = [head, ...items];
    if (k.status === "accepted") text.push(t("ticket.accepted", { time: hhmm(k.acc) }));
    const keys = k.status === "new"
      ? [[{ label: t("btn.accept"), act: "st_acc", arg: st, pick: true }, { label: t("btn.ready"), act: "st_rdy", arg: st }]]
      : [[{ label: t("btn.ready"), act: "st_rdy", arg: st, pick: true }]];
    return { text: text.join("\n"), keys };
  }

  // Как в боте: сообщение «Мои столы» показывает состояние на момент нажатия и потом не меняется.
  function myTables(snap) {
    if (!snap) return { text: t("tables.none") };
    const text = [t("tables.line", { place: place(), number: S.number, sum: money(total()), time: hhmm(S.sentAt) })];
    const st = Object.entries(snap).map(([s, status]) => `${ICON[s]} ${t("status." + status)}`).join("   ");
    if (st) text.push("   " + st);
    const allReady = Object.values(snap).every((v) => v === "ready");
    return { text: text.join("\n"), keys: S.billReq || S.paid ? [] : [[{ label: `🧾 ${place()}`, act: "w_bill", pick: allReady }]] };
  }

  function kassaScreen() {
    const p = place();
    if (S.kview === "done") return { text: t("pay.done", { place: p, sum: money(total()) }) + ` · ${t("pay." + S.method)}` };
    if (!S.sent || S.paid) return { text: t("tables.none") };
    if (S.kview === "list") {
      return {
        text: t("kassa.title"),
        keys: [[{ label: `${p} #${S.number} · ${money(total())} · ${t("waiterName")}${S.billReq ? " 🔔" : ""}`, act: "k_bill", pick: S.billReq }],
               [{ label: t("btn.refresh"), act: "k_list" }]],
      };
    }
    const billText = [t("bill.title", { place: p, number: S.number, waiter: t("waiterName") })];
    for (const l of lines()) billText.push(`${l.q}× ${name(l.m)} — ${money(l.m.price * l.q)}`);
    billText.push("—".repeat(14), `${t("bill.total")}: ${money(total())}`);
    if (S.kview === "bill") {
      return { text: billText.join("\n"), keys: [[{ label: t("btn.paid"), act: "k_pay", pick: true }, { label: t("btn.cancel_item"), act: "demo_only" }], [{ label: t("btn.back"), act: "k_list" }]] };
    }
    // способ оплаты
    return {
      text: t("pay.how", { sum: money(total()) }),
      keys: [[{ label: t("pay.cash"), act: "k_method", arg: "cash" }, { label: t("pay.card"), act: "k_method", arg: "card", pick: true }, { label: t("pay.transfer"), act: "k_method", arg: "transfer" }],
             [{ label: t("btn.back"), act: "k_bill" }]],
    };
  }

  // Пример дня: эти чеки «уже были» до заказа из демо.
  const BASE = { revenue: 1186, checks: 45, cash: 418, card: 612, transfer: 156, cancels: 3, cancelSum: 26, lost: 8 };
  function day() {
    const d = { ...BASE };
    if (S.paid) { d.revenue += total(); d.checks += 1; d[S.method] += total(); }
    d.avg = Math.round(d.revenue / d.checks);
    return d;
  }
  function today() {
    const n = new Date();
    return `${String(n.getDate()).padStart(2, "0")}.${String(n.getMonth() + 1).padStart(2, "0")}.${n.getFullYear()}`;
  }
  function reportText() {
    const d = day();
    const top = [["capp", 38], ["plov", 21], ["manti", 17]].map(([id, q]) => `${name(item(id))} ${q}`).join(", ");
    return [
      t("report.title", { cafe: t("cafe"), date: today() }),
      t("report.revenue", { sum: money(d.revenue), n: d.checks, avg: money(d.avg) }),
      `💵 ${money(d.cash)}  💳 ${money(d.card)}  📲 ${money(d.transfer)}`,
      t("report.cancels", { n: d.cancels, sum: money(d.cancelSum), lost: money(d.lost) }),
      t("report.top", { items: top }),
      "",
      t("report.sheet_ok"),
    ].join("\n");
  }

  // ---------- действия ----------
  const ACT = {
    w_new() {
      push("waiter", { kind: "me", key: "btn.new_order" });
      if (S.sent) { push("waiter", { kind: "text", key: "onlyOne" }); return; }
      freezeWaiterScreen("cancelled");
      S.table = null; S.cart = {}; S.cat = null; S.wview = "tables";
      push("waiter", { kind: "wscreen" });
    },
    w_table(n) { S.table = n; S.wview = "cart"; },
    w_cat(c) { S.cat = c; },
    w_add(id) { S.cart[id] = (S.cart[id] || 0) + 1; },
    w_cancel() { freezeWaiterScreen("cancelled"); S.wview = null; S.table = null; S.cart = {}; },
    w_send() {
      if (!lines().length) return;
      freezeWaiterScreen("sent"); S.wview = null; S.sent = true; S.sentAt = tick();
      for (const st of ["kitchen", "bar"]) {
        if (!short(st)) continue;
        S.tickets[st] = { status: "new", created: S.clock };
        push(st, { kind: "ticket", st });
      }
    },
    st_acc(st) {
      const k = S.tickets[st]; if (!k || k.status !== "new") return;
      k.status = "accepted"; k.acc = tick(1);
      push("waiter", { kind: "text", key: "notify.accepted", args: () => ({ place: place(), station: `${ICON[st]} <b>${esc(stationName(st))}</b>` }), html: true });
    },
    st_rdy(st) {
      const k = S.tickets[st]; if (!k || k.status === "ready") return;
      if (k.status === "new") k.acc = S.clock;
      k.status = "ready"; k.ready = tick(st === "kitchen" ? 11 : 4);
      push("waiter", { kind: "text", key: "notify.ready", args: () => ({ place: place(), station: `${ICON[st]} <b>${esc(stationName(st))}</b>`, items: esc(short(st)) }), html: true });
    },
    w_my() {
      push("waiter", { kind: "me", key: "btn.my_tables" });
      const snap = S.sent && !S.paid ? Object.fromEntries(Object.entries(S.tickets).map(([s, k]) => [s, k.status])) : null;
      push("waiter", { kind: "mytables", snap });
    },
    w_bill() {
      if (!S.sent || S.billReq || S.paid) return;
      S.billReq = true; tick(2);
      push("waiter", { kind: "text", key: "bill.requested" });
      push("cashier", { kind: "text", key: "notify.bill", args: () => ({ place: place(), sum: money(total()), waiter: t("waiterName") }) });
    },
    k_open() { push("cashier", { kind: "me", key: "btn.open_checks" }); S.kview = "list"; freezeKassa(); push("cashier", { kind: "kscreen" }); },
    k_list() { S.kview = "list"; },
    k_bill() { if (S.sent && !S.paid) S.kview = "bill"; },
    k_pay() { if (S.sent && !S.paid) S.kview = "pay"; },
    k_method(m) {
      if (S.paid) return;
      S.paid = true; S.method = m; S.kview = "done"; S.paidAt = tick(1);
      push("waiter", { kind: "text", key: "pay.done", args: () => ({ place: place(), sum: money(total()) }) });
    },
    k_shift() {
      push("cashier", { kind: "me", key: "btn.shift_now" });
      const open = S.sent && !S.paid ? 1 + BUSY.length : BUSY.length;
      push("cashier", { kind: "text", key: "shift", args: () => { const d = day(); return { sum: money(d.revenue), n: d.checks, cash: money(d.cash), card: money(d.card), transfer: money(d.transfer), open }; } });
    },
    report() {
      if (!S.paid || S.report) return;
      S.report = true;
      push("owner", { kind: "report", time: 23 * 60 + 30 });
    },
  };

  function freezeWaiterScreen(how) {
    const live = chats.waiter.filter((m) => m.kind === "wscreen" && !m.frozen).pop();
    if (live) live.frozen = how;
  }
  function freezeKassa() {
    // старый экран кассы остаётся как текст, кнопки живут только на последнем
    chats.cashier.filter((m) => m.kind === "kscreen").forEach((m) => (m.stale = true));
  }

  // ---------- подсказка ----------
  function hint() {
    const allReady = S.sent && Object.values(S.tickets).every((k) => k.status === "ready");
    const pending = ["kitchen", "bar"].find((st) => S.tickets[st] && S.tickets[st].status !== "ready");
    if (S.report) return { n: 6, key: "h8", target: "owner" };
    if (S.paid) return { n: 6, key: "h7", target: "owner", go: "report" };
    if (S.billReq) return { n: 5, key: "h6", target: "cashier" };
    if (allReady) return { n: 4, key: "h5", target: "waiter", args: { n: S.table === "x" ? "" : S.table } };
    if (pending) return { n: 3, key: "h4", target: pending, args: { station: stationName(pending) } };
    if (S.wview === "cart") return { n: 2, key: lines().length ? "h3b" : "h3", target: "waiter" };
    if (S.wview === "tables") return { n: 1, key: "h2", target: "waiter" };
    return { n: 1, key: "h1", target: "waiter" };
  }

  // ---------- отрисовка ----------
  const PANELS = [
    { id: "waiter", ava: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/></svg>', title: "w", sub: "wSub", dock: () => [[{ label: t("btn.new_order"), act: "w_new", pick: !S.sent && !S.wview }, { label: t("btn.my_tables"), act: "w_my", pick: S.sent && !S.billReq && Object.values(S.tickets).every((k) => k.status === "ready") }]] },
    { id: "kitchen", ava: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1.918 0 3.52 1.35 3.91 3.151a4 4 0 0 1 2.09 7.723v7.126h-12v-7.126a4 4 0 1 1 2.092 -7.723a4 4 0 0 1 3.908 -3.151z"/><path d="M6.161 17.009l11.839 -.009"/></svg>', title: "k", sub: "kSub", dock: null },
    { id: "bar", ava: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c.83 .642 2.077 1.017 3.5 1c1.423 .017 2.67 -.358 3.5 -1c.83 -.642 2.077 -1.017 3.5 -1c1.423 -.017 2.67 .358 3.5 1"/><path d="M8 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2"/><path d="M12 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2"/><path d="M3 10h14v5a6 6 0 0 1 -6 6h-2a6 6 0 0 1 -6 -6v-5z"/><path d="M16.746 16.726a3 3 0 1 0 .252 -5.555"/></svg>', title: "b", sub: "bSub", dock: null },
    { id: "cashier", ava: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/><path d="M12 14a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 9v-2a2 2 0 0 0 -2 -2h-10a2 2 0 0 0 -2 2v6a2 2 0 0 0 2 2h2"/></svg>', title: "c", sub: "cSub", dock: () => [[{ label: t("btn.open_checks"), act: "k_open", pick: S.billReq && !S.paid && S.kview !== "bill" && S.kview !== "pay" && !chats.cashier.some((m) => m.kind === "kscreen" && !m.stale) }, { label: t("btn.shift_now"), act: "k_shift" }]] },
  ];

  function keysHtml(keys, cls = "keys") {
    if (!keys || !keys.length) return "";
    return `<div class="${cls}">` + keys.map((row) => `<div class="row">` + row.map((k) =>
      `<button type="button" data-act="${k.act}"${k.arg !== undefined ? ` data-arg="${esc(k.arg)}"` : ""}${k.pick ? ' class="pick"' : ""}>${esc(k.label)}</button>`
    ).join("") + `</div>`).join("") + `</div>`;
  }

  function chatHtml(id) {
    const list = chats[id];
    const lastLive = {}; // кнопки только у последнего «живого» экрана каждого вида
    list.forEach((m) => { if (["wscreen", "kscreen", "mytables"].includes(m.kind)) lastLive[m.kind] = m.id; });
    return list.map((m) => {
      const v = view(m);
      let keys = v.keys;
      if (m.stale || m.frozen || (lastLive[m.kind] && lastLive[m.kind] !== m.id)) keys = null;
      if (m.kind === "kscreen" && m.stale) return ""; // прошлый экран кассы заменён новым
      const body = v.html || m.html ? v.text : esc(v.text);
      return `<div class="msg${v.me ? " me" : ""}"><div class="bubble">${body}<time>${hhmm(m.time)}</time></div>${keysHtml(keys)}</div>`;
    }).join("");
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = t("title") + " · Abdullab";
    location.hash = lang;
    for (const l of Object.keys(T)) document.getElementById("lang-" + l).setAttribute("aria-pressed", String(l === lang));
    $("t-title").textContent = t("title");
    $("t-eyebrow").textContent = t("eyebrow");
    $("nav-bots").textContent = t("navBots");
    $("nav-bots").href = lang === "ru" ? "ru/#bots" : "./#bots";
    $("logo").href = lang === "ru" ? "ru/" : "./";
    $("nav-write").textContent = t("navWrite");
    $("final-title").textContent = t("finalTitle");
    $("final-text").textContent = t("finalText");
    $("final-btn").textContent = t("finalBtn");
    $("t-sub").textContent = t("sub");
    $("reset").textContent = t("reset");

    const h = hint();
    $("hint-step").textContent = S.report ? t("done") : t("step", { n: h.n });
    $("hint-text").textContent = t(h.key, h.args || {});
    const go = $("hint-go");
    if (h.go === "report") { go.hidden = false; go.textContent = t("showReport"); go.dataset.act = "report"; }
    else if (narrow() && h.target !== tab && h.target !== "owner") { go.hidden = false; go.textContent = t("open", { name: t(PANELS.find((p) => p.id === h.target).title) }); go.dataset.act = "tab"; go.dataset.arg = h.target; }
    else go.hidden = true;

    $("tabs").innerHTML = PANELS.map((p) =>
      `<button type="button" role="tab" data-act="tab" data-arg="${p.id}" aria-selected="${p.id === tab}">${p.ava} ${esc(t(p.title))}${unread[p.id] ? `<span class="badge">${unread[p.id]}</span>` : ""}</button>`
    ).join("");

    const stage = $("stage");
    const scroll = {};
    stage.querySelectorAll(".chat").forEach((c) => (scroll[c.dataset.id] = c.scrollHeight - c.scrollTop - c.clientHeight < 40));
    stage.innerHTML = PANELS.map((p) => `
      <div class="phone${p.id === tab ? " active" : ""}${h.target === p.id ? " is-target" : ""}" data-panel="${p.id}">
        <header><span class="ava" aria-hidden="true">${p.ava}</span><div><b>${esc(t(p.title))}</b><small>${esc(t(p.sub))}</small></div></header>
        <div class="chat" data-id="${p.id}">${chatHtml(p.id)}</div>
        <div class="dock">${p.dock ? keysHtml(p.dock(), "dock-keys") : `<div class="group-note">${esc(t("groupNote"))}</div>`}</div>
      </div>`).join("");
    stage.querySelectorAll(".chat").forEach((c) => { c.scrollTop = c.scrollHeight; });

    const owner = $("owner");
    owner.hidden = !S.report;
    if (S.report) {
      $("phone-owner").innerHTML = `<header><span class="ava" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/><path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/><path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/><path d="M4 20h14"/></svg></span><div><b>${esc(t("o"))}</b><small>${esc(t("oSub"))}</small></div></header><div class="chat">${chatHtml("owner")}</div>`;
      $("sheet-title").textContent = t("sheetTitle");
      $("sheet-tabs").innerHTML = t("sheetTabs").map((s, i) => `<span class="${i === 1 ? "on" : ""}">${esc(s)}</span>`).join("");
      const head = t("sheetHead");
      const methods = t("methods");
      const n = new Date();
      const date = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
      const ru = lang === "ru";
      const away = ru ? "с собой" : "takeaway";
      const sample = ru
        ? [[11, 3, "Гиорги", "11:52", "12:31", "card", 34, "2× Хачапури, 2× Латте"],
           [12, 7, "Нино", "12:05", "12:44", "cash", 18, "1× Плов"],
           [13, "", "Гиорги", "12:20", "12:26", "transfer", 14, "2× Капучино, 1× Чай чёрный"]]
        : [[11, 3, "Giorgi", "11:52", "12:31", "card", 34, "2× Khachapuri, 2× Latte"],
           [12, 7, "Nino", "12:05", "12:44", "cash", 18, "1× Plov"],
           [13, "", "Giorgi", "12:20", "12:26", "transfer", 14, "2× Cappuccino, 1× Black tea"]];
      const sampleRows = sample.map((r) => [date, r[0], r[1] || away, r[2], r[3], r[4], methods[r[5]], r[6], r[7]]);
      // В таблице имена как в боте у сотрудника; позиции — на языке таблицы (ru или en)
      const ours = [date, S.number, S.table === "x" ? away : S.table, ru ? "Нино" : "Nino",
        hhmm(S.sentAt), hhmm(S.paidAt), methods[S.method], total(), lines().map((l) => `${l.q}× ${l.m[ru ? "ru" : "en"]}`).join(", ")];
      $("sheet-table").innerHTML = `<table><thead><tr>${head.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>` +
        sampleRows.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`).join("") +
        `<tr>${ours.map((x) => `<td class="new">${esc(x)}</td>`).join("")}</tr></tbody></table>`;
      $("sheet-note").textContent = t("sheetNote");
    }

    $("features").innerHTML = t("features").map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
  }
  const $ = (id) => document.getElementById(id);

  // ---------- аналитика: шаги демо (analytics.js, по одному разу за загрузку) ----------
  const MILESTONES = { w_send: "demo_order_sent", st_rdy: "demo_station_ready", k_method: "demo_paid", report: "demo_complete" };
  const reached = new Set();
  function milestone(act) {
    for (const name of ["demo_start", MILESTONES[act]]) {
      if (!name || reached.has(name)) continue;
      reached.add(name);
      if (window.track) window.track(name, { demo_lang: lang });
    }
  }

  // ---------- события ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; render(); return; }
    if (b.id === "reset") { fresh(); render(); return; }
    const act = b.dataset.act, arg = b.dataset.arg;
    if (!act) return;
    if (act === "tab") { tab = arg; unread[arg] = 0; render(); return; }
    if (act === "busy" || act === "demo_only") return;
    const fn = ACT[act];
    if (!fn) return;
    fn(arg !== undefined && /^\d+$/.test(arg) ? Number(arg) : arg);
    milestone(act);
    if (act === "report") requestAnimationFrame(() => $("owner").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }));
    render();
  });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (T[h] && h !== lang) { lang = h; render(); } });
  matchMedia("(max-width: 720px)").addEventListener("change", render);

  fresh();
  render();
})();
</script>

</body>
</html>
