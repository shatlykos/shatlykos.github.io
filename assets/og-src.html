<!doctype html>
<!-- Источник для assets/og-image.png (1200×630). Пересобрать: headless Edge --screenshot --window-size=1200,630 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Abdullab og image</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:
    radial-gradient(600px 380px at 50% 38%, rgba(61,130,255,.22), transparent 70%),
    radial-gradient(900px 500px at 50% 120%, rgba(23,57,201,.25), transparent 70%),
    #0d0f14;
  color:#f1f2f4;font-family:Lexend,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.logo{width:900px;height:auto;filter:drop-shadow(0 18px 40px rgba(42,109,244,.30))}


.rule{display:flex;align-items:center;gap:22px;margin-top:34px}
.rule i{display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,#3d82ff)}
.rule i:last-child{transform:scaleX(-1)}
.tag{font-weight:300;font-size:27px;letter-spacing:.32em;color:#a9b4cc;padding-left:.32em}
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="Abdullab">
<div class="rule"><i></i><div class="tag">AUTOMATION · INNOVATION · GROWTH</div><i></i></div>
</body>
</html>
